name: probe-hosts
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: testar hosts
        run: |
          python3 - <<'PY'
          import json, socket, urllib.request, urllib.error
          hosts = ["https://api-akm.goodreels.com","https://api2.good-short.com",
                   "https://api.goodreels.com","https://api.good-short.com"]
          out = []
          for h in hosts:
              try:
                  ip = socket.gethostbyname(h.replace("https://",""))
              except Exception as e:
                  ip = "dns-erro"
              corpo = b'{"timestamp":"0"}'
              req = urllib.request.Request(h + "/hwycclientreels/app/health", data=corpo,
                                           method="POST", headers={"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      txt = r.read(400).decode("utf-8","replace")
                      out.append("%s ip=%s http=%s body=%s" % (h, ip, r.status, txt[:160]))
              except urllib.error.HTTPError as e:
                  txt = e.read(300).decode("utf-8","replace")
                  out.append("%s ip=%s http=%s body=%s" % (h, ip, e.code, txt[:160]))
              except Exception as e:
                  out.append("%s ip=%s ERRO %r" % (h, ip, e))
          print("\n".join(out))
          PY
