name: probe2
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet cryptography
      - name: testar
        env:
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
        run: python -u probe2.py
