name: gs-harvest

on:
  workflow_dispatch:
    inputs:
      shard:
        description: "indice do shard"
        default: "0"
      of:
        description: "total de shards"
        default: "40"
      workers:
        description: "workers paralelos"
        default: "8"
      limit:
        description: "limite de livros (0 = todos)"
        default: "0"

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet cryptography
          ffmpeg -version | head -1
      - name: harvest
        env:
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
          B2_KID: ${{ secrets.B2_KID }}
          B2_AK: ${{ secrets.B2_AK }}
          GS_HOSTS: "https://api2.good-short.com,https://api.goodreels.com,https://api.good-short.com"
        run: |
          python -u gs_harvest.py \
            --ids gs_prioridade.json \
            --workers ${{ inputs.workers }} \
            --shard ${{ inputs.shard }} \
            --of ${{ inputs.of }} \
            --limit ${{ inputs.limit }}
      - name: progresso
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progresso-${{ inputs.shard }}-of-${{ inputs.of }}
          path: gs_progresso.jsonl
          if-no-files-found: ignore
